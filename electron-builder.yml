appId: com.printtracker.app
productName: Print Tracker
copyright: Copyright © 2026

# Packaging never publishes. Releases are attached to a GitHub release by the
# workflow's own job, which is the only place a token exists.
#
# This cannot be left unset. When `publish` is absent electron-builder reads the
# git remote, concludes the provider is GitHub, and then applies an implicit
# policy: `onTagOrDraft` whenever it detects CI, or `onTag` on a tag. For GitHub
# that policy means it really does try to publish, so it demands GH_TOKEN and
# fails the build with "GitHub Personal Access Token is not set". The CI Windows
# job has no token, so it would fail on every push, not only on tags - and a
# developer with GH_TOKEN exported would publish a release from their laptop by
# accident. `null` disables the mechanism outright.
publish: null

directories:
  buildResources: build
  output: release

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,npm-shrinkwrap.json,pnpm-lock.yaml,yarn.lock}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'

# node-sqlite3-wasm loads its .wasm next to its own JS file, so it has to live
# outside the asar archive.
asarUnpack:
  - '**/node_modules/node-sqlite3-wasm/**'

win:
  executableName: print-tracker
  target:
    # An installer (with the usual shortcuts), plus a single-file build that
    # runs straight from the download with no installation step.
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  artifactName: ${name}-${version}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Print Tracker

portable:
  artifactName: ${name}-${version}-portable.${ext}

linux:
  target:
    - AppImage
  category: Utility
