name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Lets you produce a downloadable exe on demand from the Actions tab.
  workflow_dispatch:

# Least privilege by default; only the release job opts into write access.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  windows:
    name: Build Windows executable
    needs: verify
    # Windows runners are billed at a higher rate and a PR does not need an
    # installer, so only build for pushes, tags and manual runs.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer and portable exe
        # Both Windows targets come from electron-builder.yml.
        run: npm run build:win
        env:
          # There is no code-signing certificate in CI, so do not go looking
          # for one in the Windows certificate store.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Show build output
        shell: pwsh
        run: Get-ChildItem release | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: print-tracker-windows
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error

  release:
    name: Attach exe to GitHub release
    needs: windows
    # Pushing a tag such as v0.1.0 publishes a release you can download from.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          name: print-tracker-windows
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - replacing assets"
            gh release upload "$TAG" dist/*.exe --clobber
          else
            gh release create "$TAG" dist/*.exe \
              --title "Print Tracker $TAG" \
              --generate-notes
          fi
